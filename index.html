<!DOCTYPE html>
<html lang="es">

<head>

        <script src="https://kit.fontawesome.com/76444b214e.js" crossorigin="anonymous"></script>
        
        <meta charset="UTF-8">
        
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>QCOSA3D - Catálogo</title>

        <link rel="icon" type="image/png" href="logo.png">


    <style>


        /* =====================================================
           CONFIGURACIÓN GENERAL
        ===================================================== */

        * {
            box-sizing: border-box;
            font-family: Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

      body {
    min-height: 100vh;
    margin: 0;
    padding: 20px;

    background: linear-gradient(
        to bottom,
        #1196ee 0%,
        #64c7f5 50%,
        #bfe5ff 100%
    );

    background-attachment: fixed;

    color: #000000;
}

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }


        /* =====================================================
           LOGO
        ===================================================== */

        .logo {
            width: 250px;
            height: auto;
            display: block;
            margin: 0 auto 10px auto;
        }


        /* =====================================================
           ENCABEZADO
        ===================================================== */

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        header p {
            color: #ffffff;
            font-size: 1.1rem;
            font-weight: bold;
            margin-top: 10px;
            letter-spacing: 0.20px;

            background: #0354eacc;
            padding: 10px 18px;
            border-radius: 12px;
        }


        /* =====================================================
           BUSCADOR
        ===================================================== */

        .search-box {
            width: 100%;
            margin-bottom: 15px;

            display: flex;
            align-items: center;

            background: white;
            border: 3px solid #0354eacc;
            border-radius: 10px;

            padding: 0 15px;
        }

        .search-box i {
            font-size: 18px;
            color: #555;

            margin-right: 12px;
            flex-shrink: 0;
        }

        .search-box input {
            width: 100%;

            padding: 14px 0;

            border: none;
            outline: none;

            background: transparent;

            font-size: 1rem;
        }

        .search-box:focus-within {
            border-color: #25d366;
        }


        /* =====================================================
           CATEGORÍAS
        ===================================================== */

        .category-btn {
            background: white;
            color: #333;
            border: 1px solid #ddd;
            padding: 9px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }

        .category-btn:hover {
            background: #eee;
        }

        .category-btn.active {
            background: #ff5e00;
            color: white;
            border-color: #ff5e00;
        }


        /* =====================================================
           DISTRIBUCIÓN CATÁLOGO + CARRITO
        ===================================================== */

        .catalog-layout {
            display: grid;
            grid-template-columns: 1fr 330px;
            gap: 25px;
            align-items: start;
        }

        .products-section {
            min-width: 0;
        }


        /* =====================================================
           PRODUCTOS
        ===================================================== */

        .grid {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(220px, 1fr));

            gap: 20px;
        }

        .card {
            background: white;
            border-radius: 12px;
            border: 3px solid #0354eacc;
            padding: 16px;

            box-shadow:
                0 4px 6px rgba(0,0,0,0.05);

            text-align: center;

            display: flex;
            flex-direction: column;
            justify-content: space-between;

            cursor: pointer;

            transition:
                transform 0.2s,
                box-shadow 0.2s;
        }

        .card:hover {
            transform: translateY(-4px);

            box-shadow:
                0 8px 15px rgba(0,0,0,0.10);
        }

        .card img {
            width: 100%;
            height: 200px;

            object-fit: contain;

            border-radius: 8px;

            margin-bottom: 12px;
        }

        .card h3 {
            font-size: 1.1rem;
            margin-bottom: 6px;
        }

        .price {
            font-weight: bold;
            color: #fadc1c;
            font-size: 1.2rem;
            margin-bottom: 12px;
        }

        .card button {
            background: #25d366;
            color: white;

            border: none;

            padding: 10px 16px;

            border-radius: 8px;

            font-weight: bold;

            cursor: pointer;

            font-size: 1rem;

            transition: transform 0.2s, background 0.2s;
        }

        .card button:hover {
            background: #1ebd56;
            transform: scale(1.05);

        }

        /* =====================================================
        PIE DE PÁGINA / CRÉDITOS
        ===================================================== */

        .footer {
            margin-top: 50px;
            padding: 40px 20px 25px 20px;

            background: #000000;
            color: white;

            border-radius: 0;

            width: 100vw;
            margin-left: calc(50% - 50vw);

            margin-bottom: -20px;

            box-sizing: border-box;
        }

        .footer-content {
            max-width: 1000px;
            margin: 0 auto;

            display: flex;
            justify-content: space-between;
            align-items: center;

            gap: 30px;
        }

        .footer-info h2 {
            margin-bottom: 15px;
        }

        .footer-info p {
            margin: 8px 0;
            color: #ffffff;
        }

        .footer-info a {
            color: #1196ee;
            text-decoration: none;
            font-weight: bold;
        }

        .footer-info a:hover {
            text-decoration: underline;
        }

        .footer-credit {
            text-align: right;
            color: #999;
        }

        .footer-credit p {
            margin: 6px 0;
        }

        .background-image {
            z-index: 0;
            pointer-events: none;
        }

        .footer {
            position: relative;
            z-index: 1;
        }

        .menu-categories {
            z-index: 5000 !important;
        }

        .categories {
            z-index: 4999 !important;
        }


        /* CELULAR */

        @media (max-width: 700px) {

            .footer {
                margin-top: 35px;
                padding: 30px 20px 20px;
            }

            .footer-content {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }

            .footer-credit {
                text-align: center;
            }

        }


        /* =====================================================
           CARRITO DE COMPUTADORA
        ===================================================== */

        .cart-section {
            background-color: white;

            border-radius: 12px;

            padding: 20px;

            border: 3px solid #0354eacc;

            box-shadow:
                0 4px 6px rgba(0,0,0,0.05);

            position: sticky;

            top: 20px;
        }

        .cart-section h2 {
            margin-bottom: 10px;
        }


        /* =====================================================
           ELEMENTOS DEL CARRITO
        ===================================================== */

        .cart-item {
            display: flex;

            justify-content: space-between;

            align-items: center;

            padding: 12px 0;

            border-bottom: 1px solid #eee;

            gap: 10px;
        }

        .cart-info {
            flex: 1;
        }

        .cart-name {
            font-weight: bold;
        }

        .cart-price {
            color: #666;
            font-size: 0.9rem;
        }


        /* =====================================================
           BOTON DELETE
        ===================================================== */

        .quantity-controls {
            display: flex;

            align-items: center;

            gap: 8px;
        }

        .quantity-controls button {
            width: 30px;
            height: 30px;

            border: none;

            border-radius: 6px;

            background: #eee;

            cursor: pointer;

            font-size: 1.1rem;
        }

        .quantity-controls button:hover {
            background: #ddd;
        }

        .delete-btn {
            background: #e0210b !important;
            color: white;
        }

        .delete-btn i {
            font-size: 16px;
        }


        /* =====================================================
           TOTAL
        ===================================================== */

        .cart-total {
            font-size: 1.3rem;

            font-weight: bold;

            text-align: right;

            margin-top: 16px;
        }


        /* =====================================================
           FORMULARIO
        ===================================================== */

        .form-group {
            margin-top: 15px;
        }

        .form-group label {
            display: block;

            margin-bottom: 5px;

            font-size: 0.9rem;

            font-weight: bold;
        }

        .form-group input {
            width: 100%;

            padding: 10px;

            border: 3px solid #0354eacc;

            border-radius: 6px;

            font-size: 1rem;
        }


        /* =====================================================
           BOTÓN WHATSAPP
        ===================================================== */

        .btn-send {
            width: 100%;

            background: #128c55;

            margin-top: 20px;

            padding: 14px;

            font-size: 1rem;

            color: white;

            border: none;

            border-radius: 10px;

            font-weight: bold;

            cursor: pointer;

            transition: transform 0.2s, background 0.2s;
        }

       .btn-send:hover {
            background: #128c55;
            transform: scale(1.03);
        }

        /* =====================================================
           SIN RESULTADOS
        ===================================================== */

        .no-results {
            grid-column: 1 / -1;

            text-align: center;

            color: #777;

            padding: 30px;
        }


            /* =====================================================
            MODAL DEL PRODUCTO
            ===================================================== */

            .modal {
                display: none;

                position: fixed;

                z-index: 1000;

                left: 0;
                top: 0;

                width: 100%;
                height: 100%;

                background: rgba(0,0,0,0.7);

                align-items: center;

                justify-content: center;

                padding: 20px;
            }

            .modal-content {
                background: white;

                width: 100%;

                max-width: 600px;

                max-height: 90vh;

                overflow-y: auto;

                border-radius: 15px;

                padding: 20px;

                position: relative;

                text-align: center;
            }

        .close {
            position: absolute;

            top: 10px;
            right: 12px;

            width: 45px;
            height: 45px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 32px;
            font-weight: bold;

            color: #555;

            background: #ffffff;

            border-radius: 50%;

            cursor: pointer;

            z-index: 100;

            line-height: 1;
        }

        .close:hover {
            background: #ffffff;
            color: #000;
        }

        .modal-image {
            width: 100%;

            height: 350px;

            object-fit: contain;

            border-radius: 10px;

            margin-bottom: 15px;
        }

        .modal-gallery {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .gallery-btn {
            position: absolute;

            top: 50%;
            transform: translateY(-50%);

            width: 45px;
            height: 45px;

            border: none;
            border-radius: 50%;

            background: rgba(0, 0, 0, 0.6);
            color: white;

            font-size: 35px;
            line-height: 35px;

            cursor: pointer;

            z-index: 10;
        }

        .gallery-btn:hover {
            background: rgba(0, 0, 0, 0.8);
        }

        .gallery-btn.prev {
            left: 10px;
        }

        .gallery-btn.next {
            right: 10px;
        }

        #image-counter {
            text-align: center;
            margin-top: 5px;
            margin-bottom: 15px;
            color: #777;
            font-size: 0.9rem;
        }

        .modal-content h2 {
            margin-bottom: 8px;
        }

        .modal-price {
            color: #fadc1c;

            font-size: 1.5rem;

            font-weight: bold;

            margin-bottom: 15px;
        }

        .modal-description {
            color: #000000;

            line-height: 1.5;

            margin-bottom: 20px;
        }

        .modal-add {
            background: #25d366;

            color: white;

            border: none;

            padding: 13px 20px;

            border-radius: 8px;

            font-weight: bold;

            font-size: 1rem;

            cursor: pointer;

            width: 100%;
        }

        .modal-add:hover {
            background: #1ebd56;
        }


        /* =====================================================
           BOTÓN CARRITO CELULAR
        ===================================================== */

            .mobile-cart-button {
            display: none;

            position: fixed;

            top: 20px;

            right: 20px;

            width: 55px;

            height: 55px;

            border: none;

            border-radius: 50%;

            background: white;

            font-size: 28px;

            cursor: pointer;
            
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            z-index: 5000;
        }


        /* =====================================================
           NÚMERO DEL CARRITO
        ===================================================== */

        #cart-count {

            position: absolute;

            top: -5px;

            right: -5px;

            min-width: 22px;

            height: 22px;

            padding: 2px 6px;

            background: red;

            color: white;

            border-radius: 50%;

            font-size: 13px;

            font-weight: bold;

            display: flex;

            align-items: center;

            justify-content: center;
        }


        /* =====================================================
           MODAL CARRITO CELULAR
        ===================================================== */

        .mobile-cart-modal {

            display: none;

            position: fixed;

            z-index: 6000;

            left: 0;

            top: 0;

            width: 100%;

            height: 100%;

            background: rgba(0,0,0,0.6);

            padding: 15px;

            align-items: center;

            justify-content: center;
        }

        .mobile-cart-content {

            background: white;

            width: 100%;

            max-width: 500px;

            max-height: 90vh;

            overflow-y: auto;

            border-radius: 15px;

            padding: 20px;

            position: relative;
        }

        .mobile-cart-close {

            position: absolute;

            right: 15px;

            top: 10px;

            font-size: 30px;

            font-weight: bold;

            cursor: pointer;
        }


        /* =====================================================
           CELULAR
        ===================================================== */

        @media (max-width: 700px) {

            body {
                padding: 0;
            }

            header p {
                width: calc(100% - 30px);
                box-sizing: border-box;
                margin: 10px auto;
                padding: 10px 14px;
            }

            /* Carrito normal desaparece */

            .cart-section {
                display: none;
            }


            /* Catálogo ocupa todo */

            .catalog-layout {
                grid-template-columns: 1fr;
            }


            /* Botón carrito aparece */

            .mobile-cart-button {
                display: block;
            }


            /* Productos en dos columnas */

            .grid {
                grid-template-columns:
                    repeat(2, 1fr);

                gap: 12px;
            }


            /* Tarjetas */

            .card {
                padding: 10px;
            }


            /* Imágenes */

            .card img {
                height: 150px;
            }


            /* Nombre */

            .card h3 {
                font-size: 0.95rem;
            }


            /* Precio */

            .price {
                font-size: 1rem;
            }


            /* Botón */

            .card button {
                font-size: 0.95rem;

                padding: 9px;
            }


            /* Logo */

            .logo {
                width: 180px;
            }


            /* Modal producto */

            .modal-image {
                height: 250px;
            }

            /* Fondo en celular */
            .background-image {
                width: 100%;
                height: 100vh;
                object-fit: cover;
                object-position: center;
            }


        }

        /* AJUSTE FINAL DEL MENU EN CELULAR */
        @media (max-width: 700px) {

        .menu-categories {
            width: 135px !important;
            height: 42px !important;

            position: absolute !important;
            left: 8px !important;
            top: 10px !important;

            padding: 0 6px !important;
            margin: 0 !important;

            font-size: 16px !important;
            z-index: 100 !important;

            box-sizing: border-box !important;
        }

        .menu-categories span {
            font-size: 16px !important;
        }
    }
    /* =====================================================
    MENÚ DE CATEGORÍAS
    ===================================================== */

    .menu-categories {
        position: fixed;

        top: 20px;
        left: 20px;

        height: 50px;
        padding: 0 15px;

        border: 3px solid #0354eacc;
        border-radius: 10px;

        background: white;

        font-size: 25px;
        font-weight: bold;

        cursor: pointer;

        box-shadow: 0 4px 10px rgba(0,0,0,0.2);

        z-index: 5000;

        display: flex;
        align-items: center;
        gap: 8px;

        transition: transform 0.2s;
    }

    .menu-categories:hover {
        transform: scale(1.08);
    }

    .menu-categories span {
        font-size: 16px;
    }


    /* =====================================================
    LISTA DE CATEGORÍAS
    ===================================================== */

    .categories {
        display: none;

        position: fixed;

        top: 80px;
        left: 20px;

        width: 240px;

        /* Altura máxima del menú */
        max-height: 70vh;

        /* Barra desplazadora vertical */
        overflow-y: auto;
        overflow-x: hidden;

        background: white;

        border-radius: 12px;

        padding: 10px;

        box-shadow: 0 5px 20px rgba(0,0,0,0.25);

        z-index: 4999;

        flex-direction: column;

        gap: 5px;
    }


    /* =====================================================
    BARRA DESPLAZADORA
    ===================================================== */

    .categories::-webkit-scrollbar {
        width: 8px;
    }

    .categories::-webkit-scrollbar-track {
        background: #f1f1f1;

        border-radius: 10px;
    }

    .categories::-webkit-scrollbar-thumb {
        background: #aaa;

        border-radius: 10px;
    }

    .categories::-webkit-scrollbar-thumb:hover {
        background: #777;
    }


    /* =====================================================
    MENÚ ABIERTO
    ===================================================== */

    .categories.show {
        display: flex;
    }


    /* =====================================================
    BOTONES DE CATEGORÍA
    ===================================================== */

    .categories .category-btn {

        width: 100%;

        text-align: left;

        border: none;

        border-radius: 8px;

        padding: 12px;

        background: white;

        color: #333;

        cursor: pointer;

        font-size: 1rem;

        font-weight: bold;
    }


    /* Al pasar el mouse */

    .categories .category-btn:hover {
        background: #eee;
    }


    /* Categoría seleccionada */

    .categories .category-btn.active {
        background: #ff5e00;

        color: white;
    }


    /* =====================================================
    IMAGEN ENCIMA DEL FONDO
    ===================================================== */

    .background-image {
        position: fixed;

        top: 0;
        left: 0;

        width: 100%;
        height: 100%;

        object-fit: cover;

        opacity: 0.20;

        pointer-events: none;

        z-index: 0;
    }

    /* CONTENIDO POR ENCIMA DE LA IMAGEN */

    .container {
        position: relative;
        z-index: 20;
    }

    .menu-categories,
    .mobile-cart-button,
    #back-to-top {
        z-index: 5000;
    }

        /* =====================================================
        MENU CATALOGO POR ENCIMA DEL FOOTER
        ===================================================== */

        .container {
            position: relative;
            z-index: 20;
        }

        .footer {
            position: relative;
            z-index: 10;
        }

        .menu-categories,
        .categories {
            z-index: 5000 !important;
        }

        </style>

</head>


<body>

    <img
        src="fondo2.png"
        class="background-image"
        alt=""
    >
    
<button 
        class="menu-categories" onclick="toggleCategories()">
        <i class="fa-solid fa-bars"></i>

        <span>CATÁLOGO</span>
</button>

<div class="container">


    <!-- =====================================================
         BOTÓN CARRITO CELULAR
    ====================================================== -->

    <button
        class="mobile-cart-button"
        onclick="openMobileCart()"
        type="button"
    >

        <i class="fa-solid fa-cart-shopping"></i>

        <span id="cart-count">
            0
        </span>

    </button>


    <!-- =====================================================
         ENCABEZADO
    ====================================================== -->

    <header>

        <img
            src="logo.webp"
            alt=""
            class="logo"
        >

        <p>
            ELEGÍ TUS PRODUCTOS DEL CATÁLOGO Y REALIZÁ EL PEDIDO
        </p>

    </header>


    <!-- =====================================================
         BUSCADOR
    ====================================================== -->

    <div class="search-box">

            <i class="fa-solid fa-magnifying-glass"></i>

            <input
                type="text"
                id="search"
                placeholder=" Buscar productos..."
                oninput="filterProducts()"
            >

    </div>


    <!-- =====================================================
         CATEGORÍAS
    ====================================================== -->

    <div
        class="categories"
        id="categories"
    ></div>


    <!-- =====================================================
         CATÁLOGO + CARRITO
    ====================================================== -->

    <div class="catalog-layout">


        <!-- PRODUCTOS -->

        <div class="products-section">

            <div
                class="grid"
                id="products-list"
            ></div>

        </div>


        <!-- =================================================
             CARRITO COMPUTADORA
        ================================================== -->

        <div class="cart-section">

            <h2>
                Tu Pedido
            </h2>


            <div id="cart-items">

                <p style="color:#888; margin-top:10px;">
                    El carrito está vacío.
                </p>

            </div>


            <div
                class="cart-total"
                id="cart-total"
            >
                Total: $0
            </div>


            <!-- NOMBRE -->

            <div class="form-group">

                <label for="client-name">
                    Nombre y Apellido:
                </label>

                <input
                    type="text"
                    id="client-name"
                >

            </div>


            <!-- WHATSAPP -->

            <button
                class="btn-send"
                onclick="sendWhatsApp()"
                type="button"
            >

                Enviar Pedido por WhatsApp

            </button>

        </div>

    </div>

</div>


<!-- =========================================================
     MODAL PRODUCTO
========================================================= -->

<div
    class="modal"
    id="product-modal"
    onclick="closeModalOutside(event)"
>

    <div
        class="modal-content"
        onclick="event.stopPropagation()"
    >

        <span
            class="close"
            onclick="closeModal()"
        >
            &times;
        </span>


      <div class="modal-gallery">

    <button
        class="gallery-btn prev"
        onclick="previousImage()"
        type="button"
    >
        ‹
    </button>

    <img
        id="modal-image"
        class="modal-image"
        src=""
        alt=""
    >

    <button
        class="gallery-btn next"
        onclick="nextImage()"
        type="button"
    >
        ›
    </button>

</div>

<div id="image-counter"></div>


        <h2 id="modal-name"></h2>


        <div
            class="modal-price"
            id="modal-price"
        ></div>


        <p
            class="modal-description"
            id="modal-description"
        ></p>


        <button
            class="modal-add"
            id="modal-add-button"
            type="button"
        >
            Agregar al pedido
        </button>

    </div>

</div>


<!-- =========================================================
     CARRITO CELULAR
========================================================= -->

<div
    class="mobile-cart-modal"
    id="mobile-cart-modal"
    onclick="closeMobileCartOutside(event)"
>

    <div
        class="mobile-cart-content"
        onclick="event.stopPropagation()"
    >


        <span
            class="mobile-cart-close"
            onclick="closeMobileCart()"
        >
            &times;
        </span>


        <h2>
            Tu Pedido
        </h2>


        <div id="mobile-cart-items">

            <p style="color:#888; margin-top:10px;">
                El carrito está vacío.
            </p>

        </div>


        <div
            class="cart-total"
            id="mobile-cart-total"
        >
            Total: $0
        </div>

    /* =====================================================
       CARRITO
    ===================================================== */

    let cart = [];


    /* =====================================================
       CATEGORÍA SELECCIONADA
    ===================================================== */

    let selectedCategory = "Inicio";


    /* =====================================================
       MOSTRAR CATEGORÍAS
    ===================================================== */
    function toggleCategories() {

        const categories =
            document.getElementById("categories");

        categories.classList.toggle("show");

}

    function renderCategories() {

        const container =
            document.getElementById("categories");

        const categories = [
            "Inicio",
            ...new Set(
                products.map(
                    product => product.category
                )
            )
        ];

        container.innerHTML = categories.map(category => `

            <button
                class="category-btn ${
                    category === selectedCategory
                        ? "active"
                        : ""
                }"
                onclick="selectCategory('${category}')"
                type="button"
            >
                ${category}
            </button>

        `).join("");

    }


    /* =====================================================
       SELECCIONAR CATEGORÍA
    ===================================================== */

    function selectCategory(category) {

    selectedCategory = category;

    renderCategories();

    filterProducts();

    // Cerrar el menú
    document
        .getElementById("categories")
        .classList.remove("show");

}


    /* =====================================================
       MOSTRAR PRODUCTOS
    ===================================================== */

    function renderProducts(list = products) {

        const container =
            document.getElementById("products-list");

        if (list.length === 0) {
            container.innerHTML = `
                <div class="no-results">
                    No se encontraron productos.
                </div>
            `;

            return;
        }

        container.innerHTML = list.map(product => `

            <div
                class="card"
                onclick="openProduct(${product.id})"
            >

                <div>

                    <img
                        src="${product.images ? product.images[0] : product.img}"
                        alt="${product.name}"
                    >

                    <h3>
                        ${product.name}
                    </h3>

                    <div class="price">
                        $${product.price.toLocaleString("es-AR")}
                    </div>

                </div>

                <button
                    onclick="
                        event.stopPropagation();
                        addToCart(${product.id});
                    "
                    type="button"
                >
                    Agregar al Pedido
                </button>

            </div>

        `).join("");
    }


    /* =====================================================
       BUSCADOR + CATEGORÍAS
    ===================================================== */

    function filterProducts() {

        const search = document
            .getElementById("search")
            .value
            .toLowerCase()
            .trim();


        const filtered = products.filter(product => {

            const name =
                (product.name || "").toLowerCase();

            const category =
                (product.category || "").toLowerCase();


            const matchesSearch =
                name.includes(search) ||
                category.includes(search);


            const matchesCategory =
                selectedCategory === "Inicio" ||
                product.category === selectedCategory;


            return matchesSearch && matchesCategory;

        });


        // Si no estamos buscando y estamos en "Inicio",
        // mostrar solamente los últimos 4 productos.

        if (
            search === "" &&
            selectedCategory === "Inicio"
        ) {

            renderProducts(
                products.slice(-4).reverse()
            );

        } else {

            // Si busca o selecciona una categoría,
            // mostrar todos los resultados.

            renderProducts(filtered);

        }

    }


    /* =====================================================
       ABRIR PRODUCTO
    ===================================================== */

    let currentProduct = null;
    let currentImageIndex = 0;


    function openProduct(productId) {

    const product = products.find(
        p => p.id === productId
    );

    if (!product) return;


    currentProduct = product;
    currentImageIndex = 0;


    // Obtener las imágenes del producto

    const images = product.images
        ? product.images
        : [product.img];


    // Mostrar primera imagen

    document.getElementById(
        "modal-image"
    ).src = images[currentImageIndex];


    document.getElementById(
        "modal-image"
    ).alt = product.name;


    // Nombre

    document.getElementById(
        "modal-name"
    ).innerText = product.name;


    // Precio

    document.getElementById(
        "modal-price"
    ).innerText =
        "$" + product.price;


    // Descripción

    document.getElementById(
        "modal-description"
    ).innerText =
        product.description;


    // Contador de imágenes

    document.getElementById(
        "image-counter"
    ).innerText =
        `${currentImageIndex + 1} / ${images.length}`;


    // Mostrar u ocultar botones

    const buttons =
        document.querySelectorAll(".gallery-btn");


    if (images.length <= 1) {

        buttons.forEach(
            button => button.style.display = "none"
        );

    } else {

        buttons.forEach(
            button => button.style.display = "block"
        );

    }


    // Botón agregar al carrito

    document.getElementById(
        "modal-add-button"
    ).onclick = function() {

        addToCart(product.id);

        closeModal();

    };


    // Abrir modal

    document.getElementById(
        "product-modal"
    ).style.display = "flex";

}

function showImage() {

    if (!currentProduct) return;

    const images = currentProduct.images
        ? currentProduct.images
        : [currentProduct.img];

    document.getElementById("modal-image").src =
        images[currentImageIndex];

    document.getElementById("modal-image").alt =
        currentProduct.name;

    document.getElementById("image-counter").innerText =
        `${currentImageIndex + 1} / ${images.length}`;
}


function nextImage() {

    if (!currentProduct) return;

    const images = currentProduct.images
        ? currentProduct.images
        : [currentProduct.img];

    currentImageIndex++;

    if (currentImageIndex >= images.length) {
        currentImageIndex = 0;
    }

    showImage();
}


function previousImage() {

    if (!currentProduct) return;

    const images = currentProduct.images
        ? currentProduct.images
        : [currentProduct.img];

    currentImageIndex--;

    if (currentImageIndex < 0) {
        currentImageIndex = images.length - 1;
    }

    showImage();
}



    /* =====================================================
       CERRAR MODAL
    ===================================================== */

    function closeModal() {

        document.getElementById("product-modal").style.display =
            "none";

    }


    function closeModalOutside(event) {

        if (
            event.target ===
            document.getElementById("product-modal")
        ) {

            closeModal();

        }

    }


    /* =====================================================
       ESC PARA CERRAR
    ===================================================== */

    document.addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Escape") {

                closeModal();

                closeMobileCart();

            }

        }
    );


    /* =====================================================
       AGREGAR AL CARRITO
    ===================================================== */

    function addToCart(productId) {

        const product = products.find(
            p => p.id === productId
        );

        if (!product) return;

        // Verificar si ya está en el carrito
        const existing = cart.find(
            item => item.id === productId
        );

        if (existing) {
            alert("Este producto ya está en tu pedido.");
            return;
        }

        // Agregar solamente 1 unidad
        cart.push({
            ...product,
            quantity: 1
        });

        updateCart();
    }


    /* =====================================================
       CAMBIAR CANTIDAD
    ===================================================== */

    function changeQuantity(productId, amount) {

        const item =
            cart.find(
                product =>
                    product.id === productId
            );


        if (!item) return;


        item.quantity += amount;


        if (item.quantity <= 0) {

            cart =
                cart.filter(
                    product =>
                        product.id !== productId
                );

        }


        updateCart();

    }


    /* =====================================================
       ELIMINAR PRODUCTO
    ===================================================== */

    function removeFromCart(productId) {

        cart =
            cart.filter(
                item =>
                    item.id !== productId
            );


        updateCart();

    }


    /* =====================================================
       CARRITO COMPUTADORA
    ===================================================== */

    function updateDesktopCart() {

        const container =
            document.getElementById("cart-items");

        const totalEl =
            document.getElementById("cart-total");


        if (cart.length === 0) {

            container.innerHTML = `
                <p style="color:#888; margin-top:10px;">
                    El carrito está vacío.
                </p>
            `;

            totalEl.innerText = "Total: $0";

            return;
        }


        let total = 0;


        container.innerHTML = cart.map(item => {

            const itemTotal =
                item.price * item.quantity;


            total += itemTotal;


            return `

                <div class="cart-item">

                    <div class="cart-info">

                        <div class="cart-name">
                            ${item.name}
                        </div>

                    </div>


                <div class="quantity-controls">

                    <button
                        class="delete-btn"
                        onclick="removeFromCart(${item.id})"
                        type="button"
                    >
                        <i class="fa-solid fa-trash"></i>
                    </button>

                </div>


                    <strong>
                        $${itemTotal.toLocaleString("es-AR")}
                    </strong>

                </div>

            `;

        }).join("");


        totalEl.innerText =
            `Total: $${total}`;

    }

       CARRITO CELULAR

        const container =

                </p>
            `;

            totalEl.innerText = "Total: $0";

            return;
        }


        let total = 0;


        container.innerHTML = cart.map(item => {

            const itemTotal =
                item.price * item.quantity;


            total += itemTotal;


            return `

                <div class="cart-item">

                    <div class="cart-info">

                        <div class="cart-name">
                            ${item.name}
                        </div>

                    </div>


                    <div class="quantity-controls">

                        <button
                            onclick="changeQuantity(${item.id}, -1)"
                            type="button"
                        >
                            −
                        </button>

                        <strong>
                            1 unidad
                        </strong>

                        <button
                                class="delete-btn"
                                onclick="removeFromCart(${item.id})"
                                type="button"
                            >
                               <i class="fa-solid fa-trash"></i> 
                            </button>

                        </div>

                    </div>


                    <strong>
                        $${itemTotal}
                    </strong>

                </div>

            `;

        }).join("");


        totalEl.innerText =
            `Total: $${total}`;

    }


    /* =====================================================

    ===================================================== */

    function updateCart() {

        const cartCount =
            document.getElementById("cart-count");


        if (cartCount) {

            const quantity =
                cart.reduce(
                    (total, item) =>
                        total + item.quantity,
                    0
                );


            cartCount.innerText =
                quantity;

        }


        updateDesktopCart();

        updateMobileCart();

    }


    /* =====================================================
       ABRIR CARRITO CELULAR
    ===================================================== */

    function openMobileCart() {

        updateMobileCart();

        document.getElementById(
            "mobile-cart-modal"
        ).style.display = "flex";

    }


    /* =====================================================
       CERRAR CARRITO CELULAR
    ===================================================== */

    function closeMobileCart() {

        document.getElementById(
            "mobile-cart-modal"
        ).style.display = "none";

    }


    /* =====================================================
       CERRAR CARRITO AFUERA
    ===================================================== */

    function closeMobileCartOutside(event) {

        if (
            event.target ===
            document.getElementById(
                "mobile-cart-modal"
            )
        ) {

            closeMobileCart();

        }

    }


    /* =====================================================
       ENVIAR WHATSAPP
    ===================================================== */

    function sendWhatsApp() {

        if (cart.length === 0) {

            alert(
                "Por favor agregá al menos un producto al carrito."
            );

            return;

        }


        let name;

        const mobileModal =
            document.getElementById(
                "mobile-cart-modal"
            );


        const mobileIsOpen =
            mobileModal.style.display === "flex";


        if (mobileIsOpen) {

            name =
                document
                    .getElementById(
                        "mobile-client-name"
                    )
                    .value
                    .trim();
         
        } else {

            name =
                document
                    .getElementById(
                        "client-name"
                    )
                    .value
                    .trim();

        }


        if (!name) {

            alert(
                "Por favor completá con tu nombre completo"
            );

            return;

        }


        let message =
            `*NUEVO PEDIDO*\n`;


        message +=
            `\n*Nombre:* ${name}\n`;


        message +=
            `*Detalle del Pedido:*\n`;


        let total = 0;


        cart.forEach(item => {

            const subtotal =
                item.price * item.quantity;


            total += subtotal;


            message +=
                `- ${item.name} x${item.quantity} ($${subtotal})\n`;

        });


        message +=
            `\n💰 *Total a pagar:* $${total}`;


        const encodedMessage =
            encodeURIComponent(message);


        window.open(
        `https://wa.me/${PHONE_NUMBER}?text=${encodedMessage}`,
        "_blank"
        );

    }
